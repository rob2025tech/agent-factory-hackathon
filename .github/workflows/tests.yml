name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Run tests
        run: |
          pytest -q --ignore=apps/api/tests/integration

      - name: Run ruff (non-blocking)
        run: |
          ruff check . || echo "::warning::ruff found lint issues (non-blocking)"
        continue-on-error: true
